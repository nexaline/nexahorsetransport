name: Tag a website version

# Run by hand (Actions tab > "Tag a website version" > Run workflow) to create a version tag such as
# v1.0 or v1.1 on a commit. Existing tags are never moved or replaced.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag to create, for example v1.1"
        required: true
      commit:
        description: "Commit (full SHA) or branch to tag"
        required: true
        default: main

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create and push the tag
        env:
          TAG: ${{ inputs.tag }}
          COMMIT: ${{ inputs.commit }}
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+(\.[0-9]+)*$ ]]; then echo "::error::Tag must look like v1.0 or v1.1"; exit 1; fi
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
            echo "::error::Tag $TAG already exists; it is never moved."; exit 1
          fi
          SHA=$(git rev-parse --verify "origin/$COMMIT^{commit}" 2>/dev/null || git rev-parse --verify "$COMMIT^{commit}")
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Website version ${TAG#v}" "$SHA"
          git push origin "refs/tags/$TAG"
          echo "Created $TAG on $SHA: $(git log -1 --format=%s "$SHA")"
