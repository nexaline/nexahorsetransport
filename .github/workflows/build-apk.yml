name: Build Nexa Team APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["android-app/**", ".github/workflows/build-apk.yml"]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Create the Android project
        run: |
          npm install --no-audit --no-fund
          npx cap add android
          npx cap sync android
      - name: Permissions (location, camera) and app icon
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#<uses-permission android:name="android.permission.INTERNET" />#<uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <uses-permission android:name="android.permission.CAMERA" />#' $M
          grep -c ACCESS_FINE_LOCATION $M
          for d in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            n=${d%%:*}; s=${d##*:}
            for f in ic_launcher.png ic_launcher_round.png ic_launcher_foreground.png; do
              t=android/app/src/main/res/mipmap-$n/$f
              [ -f "$t" ] && convert icon.png -resize ${s}x${s} "$t" || true
            done
          done
          rm -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml
      - name: Build the APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../nexa-team.apk
      - uses: actions/upload-artifact@v4
        with:
          name: nexa-team-apk
          path: android-app/nexa-team.apk
      - name: Attach to the release "team-app-apk"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view team-app-apk >/dev/null 2>&1 || gh release create team-app-apk --title "Nexa Team app (Android)" --notes "Download nexa-team.apk on an Android phone and install it."
          gh release upload team-app-apk nexa-team.apk --clobber
